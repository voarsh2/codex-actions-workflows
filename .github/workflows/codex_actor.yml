name: Codex Actor

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      repository_owner:
        required: true
        type: string
      repository_name:
        required: true
        type: string
      repository_full_name:
        required: true
        type: string
      default_branch:
        required: true
        type: string
      actor:
        required: true
        type: string
      sender_type:
        required: true
        type: string
      author_association:
        required: true
        type: string
      comment_body:
        required: true
        type: string
      comment_id:
        required: true
        type: number
      issue_number:
        required: true
        type: number
      is_pull_request:
        required: false
        type: boolean
        default: false
      pull_request_number:
        required: false
        type: number
        default: 0
      bot_branch_prefix:
        required: false
        type: string
        default: codex/issue
      model_provider:
        required: false
        type: string
        default: theclawbay
      model:
        required: false
        type: string
        default: gpt-5.5
      effort:
        required: false
        type: string
        default: medium
      codex_version:
        required: false
        type: string
        default: latest
      history_comment_limit:
        required: false
        type: number
        default: 20
      history_max_comment_chars:
        required: false
        type: number
        default: 2000
      dry_run:
        required: false
        type: boolean
        default: false
      allow_users:
        required: false
        type: string
        default: ""
      deny_untrusted:
        required: false
        type: boolean
        default: true
    secrets:
      codex_api_key:
        required: true
      codex_base_url:
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.compute.outputs.should_run }}
      should_reply: ${{ steps.compute.outputs.should_reply }}
      skip_reason: ${{ steps.compute.outputs.skip_reason }}
      command_text: ${{ steps.compute.outputs.command_text }}
      mode: ${{ steps.compute.outputs.mode }}
      reply_number: ${{ steps.compute.outputs.reply_number }}
      checkout_ref: ${{ steps.compute.outputs.checkout_ref }}
      push_ref: ${{ steps.compute.outputs.push_ref }}
      bot_branch: ${{ steps.compute.outputs.bot_branch }}
      target_number: ${{ steps.compute.outputs.target_number }}
      default_branch: ${{ steps.compute.outputs.default_branch }}
      issue_title: ${{ steps.compute.outputs.issue_title }}
    steps:
      - id: compute
        name: Compute command context
        uses: actions/github-script@v8
        env:
          INPUT_EVENT_NAME: ${{ inputs.event_name }}
          INPUT_REPOSITORY_OWNER: ${{ inputs.repository_owner }}
          INPUT_REPOSITORY_NAME: ${{ inputs.repository_name }}
          INPUT_ACTOR: ${{ inputs.actor }}
          INPUT_SENDER_TYPE: ${{ inputs.sender_type }}
          INPUT_AUTHOR_ASSOCIATION: ${{ inputs.author_association }}
          INPUT_COMMENT_BODY: ${{ inputs.comment_body }}
          INPUT_COMMENT_ID: ${{ inputs.comment_id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_IS_PULL_REQUEST: ${{ inputs.is_pull_request }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_DEFAULT_BRANCH: ${{ inputs.default_branch }}
          INPUT_BOT_BRANCH_PREFIX: ${{ inputs.bot_branch_prefix }}
          INPUT_ALLOW_USERS: ${{ inputs.allow_users }}
          INPUT_DENY_UNTRUSTED: ${{ inputs.deny_untrusted }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = process.env.INPUT_REPOSITORY_OWNER;
            const repo = process.env.INPUT_REPOSITORY_NAME;
            const actor = process.env.INPUT_ACTOR;
            const senderType = (process.env.INPUT_SENDER_TYPE || "").toLowerCase();
            const association = (process.env.INPUT_AUTHOR_ASSOCIATION || "").toUpperCase();
            const body = process.env.INPUT_COMMENT_BODY || "";
            const issueNumber = Number(process.env.INPUT_ISSUE_NUMBER || "0");
            const pullNumber = Number(process.env.INPUT_PULL_REQUEST_NUMBER || "0");
            const isPullRequest = (process.env.INPUT_IS_PULL_REQUEST || "false").toLowerCase() === "true" || process.env.INPUT_EVENT_NAME === "pull_request_review_comment";
            const defaultBranch = process.env.INPUT_DEFAULT_BRANCH || "main";
            const denyUntrusted = (process.env.INPUT_DENY_UNTRUSTED || "true").toLowerCase() === "true";
            const allowUsers = (process.env.INPUT_ALLOW_USERS || "")
              .split(",")
              .map((entry) => entry.trim().toLowerCase())
              .filter(Boolean);
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const isTrusted = trustedAssociations.has(association) || allowUsers.includes("*") || allowUsers.includes(actor.toLowerCase());
            const isBot = senderType === "bot" || actor.endsWith("[bot]");
            const summonMatch = body.match(/(?:^|\s)(@codex|\/codex)\b([\s\S]*)/i);
            const set = (name, value) => core.setOutput(name, value == null ? "" : String(value));

            set("default_branch", defaultBranch);
            set("reply_number", issueNumber);
            set("target_number", issueNumber);
            set("mode", isPullRequest ? "pr" : "issue");
            set("checkout_ref", defaultBranch);
            set("push_ref", "");
            set("bot_branch", "");
            set("issue_title", "");

            if (isBot) {
              set("should_run", "false");
              set("should_reply", "false");
              set("skip_reason", "bot_comment");
              return;
            }

            if (!summonMatch) {
              set("should_run", "false");
              set("should_reply", "false");
              set("skip_reason", "no_summon");
              return;
            }

            const commandText = (summonMatch[2] || "").trim();
            set("command_text", commandText);

            if (!commandText) {
              set("should_run", "false");
              set("should_reply", "true");
              set("skip_reason", "empty_command");
              return;
            }

            if (!isTrusted) {
              set("should_run", "false");
              set("should_reply", denyUntrusted ? "true" : "false");
              set("skip_reason", "untrusted");
              return;
            }

            if (isPullRequest) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber || issueNumber,
              });

              set("reply_number", pull.number);
              set("target_number", pull.number);
              set("issue_title", pull.title || "");
              set("checkout_ref", pull.head.ref);
              set("push_ref", pull.head.ref);

              const sameRepo = pull.head.repo.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase();
              if (!sameRepo) {
                set("should_run", "false");
                set("should_reply", "true");
                set("skip_reason", "fork_pr_unsupported");
                return;
              }
            } else {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              const prefix = (process.env.INPUT_BOT_BRANCH_PREFIX || "codex/issue")
                .replace(/[^A-Za-z0-9._\/-]+/g, "-")
                .replace(/\/{2,}/g, "/")
                .replace(/^-+|-+$/g, "") || "codex/issue";
              const branch = `${prefix}-${issueNumber}`;

              set("issue_title", issue.title || "");
              set("bot_branch", branch);
              set("push_ref", branch);
            }

            set("should_run", "true");
            set("should_reply", "true");
            set("skip_reason", "");

  act:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      run_status: ${{ steps.status.outputs.run_status }}
      final_message: ${{ steps.capture_codex.outputs.final_message }}
      commit_message: ${{ steps.capture_codex.outputs.commit_message }}
      task_plan: ${{ steps.capture_codex.outputs.task_plan }}
      changed: ${{ steps.scan_changes.outputs.changed }}
      changed_files: ${{ steps.scan_changes.outputs.changed_files }}
      commit_sha: ${{ steps.commit_push.outputs.commit_sha }}
      pr_url: ${{ steps.ensure_issue_pr.outputs.pr_url }}
      pr_number: ${{ steps.ensure_issue_pr.outputs.pr_number }}
      pr_error: ${{ steps.ensure_issue_pr.outputs.pr_error }}
      tracking_comment_id: ${{ steps.create_progress_comment.outputs.comment_id }}
      started_at_ms: ${{ steps.create_progress_comment.outputs.started_at_ms }}
    steps:
      - id: create_progress_comment
        name: Create progress comment
        uses: actions/github-script@v8
        env:
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          ACTOR: ${{ inputs.actor }}
          MODE: ${{ needs.prepare.outputs.mode }}
          REPLY_NUMBER: ${{ needs.prepare.outputs.reply_number }}
          COMMAND_TEXT: ${{ needs.prepare.outputs.command_text }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const actor = process.env.ACTOR;
            const mode = process.env.MODE;
            const issueNumber = Number(process.env.REPLY_NUMBER);
            const commandText = process.env.COMMAND_TEXT || "";
            const startedAtMs = Date.now();
            const marker = `<!-- codex-actor:progress mode=${mode} status=starting -->`;
            const body = [
              marker,
              `@${actor} Acknowledged. Starting Codex run.`,
              "",
              `Mode: \`${mode}\``,
              "Status: preparing repository context",
              "Elapsed: 0m 0s",
              "",
              "Requested command:",
              "```text",
              commandText,
              "```",
              "",
              "Task checklist:",
              "_Waiting for Codex to emit its first progress update._",
            ].join("\n");

            const { data: comment } = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });

            core.setOutput("comment_id", String(comment.id));
            core.setOutput("started_at_ms", String(startedAtMs));

      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - id: issue_branch
        name: Prepare issue branch
        if: needs.prepare.outputs.mode == 'issue'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          BOT_BRANCH: ${{ needs.prepare.outputs.bot_branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BOT_BRANCH" >/dev/null 2>&1; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin "$BOT_BRANCH"
            git checkout -B "$BOT_BRANCH" FETCH_HEAD
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            git checkout -B "$BOT_BRANCH" "refs/remotes/origin/$DEFAULT_BRANCH"
          fi

      - id: resolve_provider
        name: Resolve provider configuration
        shell: bash
        env:
          SECRET_CODEX_BASE_URL: ${{ secrets.codex_base_url }}
          INPUT_MODEL_PROVIDER: ${{ inputs.model_provider }}
        run: |
          set -euo pipefail
          base_url="${SECRET_CODEX_BASE_URL:-}"

          if [[ -z "$base_url" ]]; then
            echo "codex_base_url was not provided." >&2
            exit 1
          fi

          echo "::add-mask::$base_url"
          {
            echo "base_url=$base_url"
            echo "provider_name=${INPUT_MODEL_PROVIDER}"
          } >> "$GITHUB_OUTPUT"

      - id: prompt
        name: Build Codex prompt
        uses: actions/github-script@v8
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          TARGET_NUMBER: ${{ needs.prepare.outputs.target_number }}
          COMMAND_TEXT: ${{ needs.prepare.outputs.command_text }}
          COMMENT_ID: ${{ inputs.comment_id }}
          DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          PUSH_REF: ${{ needs.prepare.outputs.push_ref }}
          HISTORY_COMMENT_LIMIT: ${{ inputs.history_comment_limit }}
          HISTORY_MAX_COMMENT_CHARS: ${{ inputs.history_max_comment_chars }}
          RUNNER_TEMP: ${{ runner.temp }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const mode = process.env.MODE;
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const targetNumber = Number(process.env.TARGET_NUMBER);
            const commandText = process.env.COMMAND_TEXT;
            const currentCommentId = Number(process.env.COMMENT_ID || "0");
            const pushRef = process.env.PUSH_REF;
            const historyLimit = Number(process.env.HISTORY_COMMENT_LIMIT || "20");
            const historyMaxChars = Number(process.env.HISTORY_MAX_COMMENT_CHARS || "2000");
            const outputDir = path.join(process.env.RUNNER_TEMP, "codex-actor");
            const markerPattern = /<!--\s*codex-actor:reply\b[\s\S]*?-->/i;
            let title = "";
            let body = "";

            function trimForPrompt(text) {
              const normalized = (text || "").replace(/\r\n/g, "\n").trim();
              if (!normalized) {
                return "(empty)";
              }
              if (normalized.length <= historyMaxChars) {
                return normalized;
              }
              return `${normalized.slice(0, historyMaxChars)}\n...[truncated]`;
            }

            function normalizeHumanComment(text) {
              return trimForPrompt((text || "").replace(/^\s*(?:@codex|\/codex)\b\s*/i, ""));
            }

            function extractBotSummary(commentBody) {
              const withoutMarkers = (commentBody || "").replace(/<!--[\s\S]*?-->/g, "").trim();
              const summaryMatch = withoutMarkers.match(/Codex summary:\n([\s\S]*?)(?:\n\nTracked changes detected before persistence:|\n\nRequested command:|$)/i);
              if (summaryMatch) {
                return trimForPrompt(summaryMatch[1]);
              }
              return trimForPrompt(withoutMarkers);
            }

            async function loadIssueComments() {
              return github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: targetNumber,
                per_page: 100,
              });
            }

            async function loadReviewComments() {
              if (mode !== "pr") {
                return [];
              }
              return github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number: targetNumber,
                per_page: 100,
              });
            }

            if (mode === "pr") {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: targetNumber,
              });
              title = pull.title || "";
              body = pull.body || "";
            } else {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: targetNumber,
              });
              title = issue.title || "";
              body = issue.body || "";
            }

            const [issueComments, reviewComments] = await Promise.all([
              loadIssueComments(),
              loadReviewComments(),
            ]);

            const normalizedComments = [
              ...issueComments.map((comment) => ({
                source: "issue",
                id: Number(comment.id),
                created_at: comment.created_at || "",
                author: comment.user?.login || "unknown",
                association: comment.author_association || "",
                isBot: (comment.user?.type || "").toLowerCase() === "bot" || (comment.user?.login || "").endsWith("[bot]"),
                body: comment.body || "",
              })),
              ...reviewComments.map((comment) => ({
                source: "review",
                id: Number(comment.id),
                created_at: comment.created_at || "",
                author: comment.user?.login || "unknown",
                association: comment.author_association || "",
                isBot: (comment.user?.type || "").toLowerCase() === "bot" || (comment.user?.login || "").endsWith("[bot]"),
                body: comment.body || "",
              })),
            ]
              .filter((comment) => comment.id !== currentCommentId)
              .filter((comment) => {
                if (!comment.isBot) {
                  return true;
                }
                return markerPattern.test(comment.body || "");
              })
              .sort((left, right) => {
                const dateCompare = String(left.created_at).localeCompare(String(right.created_at));
                if (dateCompare !== 0) {
                  return dateCompare;
                }
                return left.id - right.id;
              });

            const recentComments = normalizedComments.slice(-historyLimit);
            const historySections = recentComments.length === 0
              ? ["No prior conversation comments."]
              : recentComments.map((comment) => {
                  const headingParts = [
                    `### ${comment.created_at || "unknown time"}`,
                    `${comment.author}${comment.association ? ` [${comment.association}]` : ""}`,
                    `${comment.source} comment`,
                  ];
                  const commentText = comment.isBot
                    ? `Codex actor summary:\n${extractBotSummary(comment.body)}`
                    : normalizeHumanComment(comment.body);
                  return `${headingParts.join(" - ")}\n${commentText}`;
                });

            const historyBlock = [
              "Conversation history:",
              ...historySections,
            ].join("\n\n");

            const prompt = [
              "You are running inside GitHub Actions as a repository actor.",
              "",
              `Repository: ${owner}/${repo}`,
              `Context: ${mode === "pr" ? "pull request" : "issue"} #${targetNumber}`,
              `Working branch: ${pushRef || process.env.DEFAULT_BRANCH}`,
              "",
              "User instruction:",
              commandText,
              "",
              `${mode === "pr" ? "Pull request" : "Issue"} title:`,
              title || "(empty)",
              "",
              `${mode === "pr" ? "Pull request" : "Issue"} body:`,
              body || "(empty)",
              "",
              historyBlock,
              "",
              "Requirements:",
              "- Make only the code or documentation changes needed to satisfy the instruction.",
              "- Do not run git commit or git push. The workflow handles persistence.",
              "- Treat the triggering comment as the active instruction. Use the issue or pull request body and prior comments only as supporting context unless the triggering comment explicitly asks you to act on them.",
              "- Use the conversation history to honor prior decisions and context, but prioritize the current command if it conflicts.",
              "- Treat `.git/` contents and Codex actor control artifacts as internal workflow data, not user-facing project files.",
              "- If you inspect the repository file list, prefer project files and ignore `.git/`, `.codex`, `codex-actor-prompt.md`, `codex-final-message.txt`, `codex-output-schema.json`, and similar runner scratch files.",
              "- Before making meaningful changes, emit a short user-facing progress update with a brief task list or plan.",
              "- For multi-step work, keep Codex's internal task checklist or plan updated so the GitHub progress comment can reflect it accurately.",
              "- During the run, emit concise user-facing progress updates when you start or finish a substantial step. These updates may be surfaced in the GitHub progress comment while you work.",
              "- Your final response must match the provided JSON schema exactly.",
              "- Set task_plan to a short ordered list of the main steps you intended to take. Use 1 to 4 concise items, or an empty list if no meaningful plan was needed.",
              "- Set reply_markdown to a concise human-readable summary of the result.",
              "- Set change_summary to a short description of what changed, or 'No changes made.' if nothing changed.",
              "- Set tests_run to a short description of tests/checks run, or 'Not run.' if none were run.",
              "- Set commit_message to a concise imperative commit subject if tracked files changed, otherwise set it to an empty string.",
            ].join("\n");

            fs.mkdirSync(outputDir, { recursive: true });
            const promptPath = path.join(outputDir, "codex-actor-prompt.md");
            const finalMessagePath = path.join(outputDir, "codex-final-message.txt");
            const outputSchemaPath = path.join(outputDir, "codex-output-schema.json");
            const progressStateDir = path.join(outputDir, "progress-state");
            const parserScriptPath = path.join(outputDir, "codex-progress-parser.js");
            const heartbeatScriptPath = path.join(outputDir, "codex-progress-heartbeat.js");
            const outputSchema = {
              type: "object",
              additionalProperties: false,
              properties: {
                task_plan: {
                  type: "array",
                  items: { type: "string" },
                },
                reply_markdown: { type: "string" },
                change_summary: { type: "string" },
                tests_run: { type: "string" },
                commit_message: { type: "string" },
              },
              required: ["task_plan", "reply_markdown", "change_summary", "tests_run", "commit_message"],
            };
            const parserScript = [
              'const fs = require("fs");',
              'const readline = require("readline");',
              '',
              'const stateDir = process.env.PROGRESS_STATE_DIR;',
              'if (!stateDir) {',
              '  process.exit(0);',
              '}',
              'fs.mkdirSync(stateDir, { recursive: true });',
              '',
              'function writeFile(name, value) {',
              '  fs.writeFileSync(`${stateDir}/${name}`, value, "utf8");',
              '}',
              '',
              'function writeFileIfChanged(name, value) {',
              '  try {',
              '    const existing = fs.readFileSync(`${stateDir}/${name}`, "utf8");',
              '    if (existing === value) return;',
              '  } catch {}',
              '  writeFile(name, value);',
              '}',
              '',
              'function normalizeText(text) {',
              '  const normalized = String(text || "").replace(/\\r\\n/g, "\\n").trim();',
              '  if (!normalized) return "";',
              '  return normalized.length > 600 ? `${normalized.slice(0, 600)}\\n...[truncated]` : normalized;',
              '}',
              '',
              'function extractText(value) {',
              '  if (!value) return "";',
              '  if (typeof value === "string") return normalizeText(value);',
              '  if (Array.isArray(value)) {',
              '    for (const item of value) {',
              '      const text = extractText(item);',
              '      if (text) return text;',
              '    }',
              '    return "";',
              '  }',
              '  if (typeof value === "object") {',
              '    const preferredKeys = ["text", "message", "delta", "content", "summary"];',
              '    for (const key of preferredKeys) {',
              '      if (key in value) {',
              '        const text = extractText(value[key]);',
              '        if (text) return text;',
              '      }',
              '    }',
              '    for (const nested of Object.values(value)) {',
              '      const text = extractText(nested);',
              '      if (text) return text;',
              '    }',
              '  }',
              '  return "";',
              '}',
              '',
              'function extractRawText(value) {',
              '  if (!value) return "";',
              '  if (typeof value === "string") return String(value).replace(/\\r\\n/g, "\\n").trim();',
              '  if (Array.isArray(value)) {',
              '    for (const item of value) {',
              '      const text = extractRawText(item);',
              '      if (text) return text;',
              '    }',
              '    return "";',
              '  }',
              '  if (typeof value === "object") {',
              '    const preferredKeys = ["text", "message", "delta", "content", "summary"];',
              '    for (const key of preferredKeys) {',
              '      if (key in value) {',
              '        const text = extractRawText(value[key]);',
              '        if (text) return text;',
              '      }',
              '    }',
              '    for (const nested of Object.values(value)) {',
              '      const text = extractRawText(nested);',
              '      if (text) return text;',
              '    }',
              '  }',
              '  return "";',
              '}',
              '',
              'function formatTaskPlanItems(items) {',
              '  if (!Array.isArray(items)) return "";',
              '  return items',
              '    .map((item) => normalizeText(item))',
              '    .filter(Boolean)',
              '    .slice(0, 6)',
              '    .map((item) => `- ${item}`)',
              '    .join("\\n");',
              '}',
              '',
              'function parseStructuredProgress(text) {',
              '  const raw = String(text || "").replace(/\\r\\n/g, "\\n").trim();',
              '  if (!raw || !raw.startsWith("{")) return null;',
              '  try {',
              '    const parsed = JSON.parse(raw);',
              '    if (!parsed || typeof parsed !== "object") return null;',
              '    const plan = formatTaskPlanItems(parsed.task_plan);',
              '    const status = normalizeText(',
              '      parsed.reply_markdown || parsed.change_summary || parsed.tests_run || ""',
              '    );',
              '    return { plan, status };',
              '  } catch {',
              '    return null;',
              '  }',
              '}',
              '',
              'function updatePlan(text) {',
              '  const normalized = normalizeText(text);',
              '  if (!normalized) return false;',
              '  writeFileIfChanged("task-plan.txt", `${normalized}\\n`);',
              '  return true;',
              '}',
              '',
              'function updateChecklist(text) {',
              '  const normalized = normalizeText(text);',
              '  if (!normalized) return false;',
              '  writeFileIfChanged("task-checklist.txt", `${normalized}\\n`);',
              '  return true;',
              '}',
              '',
              'function updateStatus(text) {',
              '  const normalized = normalizeText(text);',
              '  if (!normalized) return;',
              '  writeFileIfChanged("latest-status.txt", `${normalized}\\n`);',
              '}',
              '',
              'function updatePhase(text) {',
              '  const normalized = normalizeText(text);',
              '  if (!normalized) return;',
              '  writeFileIfChanged("phase.txt", `${normalized}\\n`);',
              '}',
              '',
              'function summarizeCommand(item) {',
              '  const command = normalizeText(item?.command || item?.formatted_command || extractText(item));',
              '  if (!command) return "";',
              '  const status = String(item?.status || "").trim();',
              '  if (status === "completed") return `Completed command: \\`${command}\\``;',
              '  if (status === "failed") return `Command failed: \\`${command}\\``;',
              '  return `Running command: \\`${command}\\``;',
              '}',
              '',
              'function summarizeFileChange(item) {',
              '  const rawChanges = Array.isArray(item?.changes) ? item.changes : [];',
              '  const paths = rawChanges',
              '    .map((change) => change?.path || change?.file_path || change?.file || "")',
              '    .filter(Boolean)',
              '    .slice(0, 4);',
              '  if (paths.length === 0) return "";',
              '  return paths.length === 1',
              '    ? `Updating file: ${paths[0]}`',
              '    : `Updating files: ${paths.join(", ")}`;',
              '}',
              '',
              'function summarizeTodoList(item) {',
              '  const entries = Array.isArray(item?.items) ? item.items : [];',
              '  const lines = entries',
              '    .map((entry) => {',
              '      const text = normalizeText(entry?.text || entry?.title || entry?.content || "");',
              '      if (!text) return "";',
              '      const done = Boolean(entry?.done || entry?.completed || entry?.status === "completed");',
              '      return `- [${done ? "x" : " "}] ${text}`;',
              '    })',
              '    .filter(Boolean)',
              '    .slice(0, 6);',
              '  return lines.join("\\n");',
              '}',
              '',
              'function summarizeToolCall(item) {',
              '  const server = normalizeText(item?.server || item?.server_name || "");',
              '  const tool = normalizeText(item?.tool || item?.tool_name || item?.name || "");',
              '  const target = [server, tool].filter(Boolean).join("/");',
              '  return target ? `Calling tool: ${target}` : "";',
              '}',
              '',
              'function handleItemEvent(eventType, item) {',
              '  const itemType = String(item?.type || "").trim();',
              '  if (!itemType) return;',
              '  if (itemType === "todo_list") {',
              '    const plan = summarizeTodoList(item);',
              '    if (updateChecklist(plan)) {',
              '      updateStatus("Updated task checklist.");',
              '      updatePhase("Planning work");',
              '    }',
              '    return;',
              '  }',
              '  if (itemType === "command_execution") {',
              '    const summary = summarizeCommand(item);',
              '    if (!summary) return;',
              '    updateStatus(summary);',
              '    updatePhase("Running repository commands");',
              '    return;',
              '  }',
              '  if (itemType === "file_change") {',
              '    const summary = summarizeFileChange(item);',
              '    if (!summary) return;',
              '    updateStatus(summary);',
              '    updatePhase("Editing repository files");',
              '    return;',
              '  }',
              '  if (itemType === "mcp_tool_call") {',
              '    const summary = summarizeToolCall(item);',
              '    if (!summary) return;',
              '    updateStatus(summary);',
              '    updatePhase("Calling external tools");',
              '    return;',
              '  }',
              '  if (itemType === "reasoning" && eventType === "item.completed") {',
              '    const summary = extractText(item);',
              '    if (!summary) return;',
              '    updateStatus(summary);',
              '    return;',
              '  }',
              '  if (itemType === "agent_message" && eventType === "item.completed") {',
              '    const rawSummary = extractRawText(item);',
              '    const summary = extractText(item);',
              '    if (!summary) return;',
              '    const structured = parseStructuredProgress(rawSummary);',
              '    updateStatus(structured?.status || summary);',
              '    try {',
              '      const existingPlan = normalizeText(fs.readFileSync(`${stateDir}/task-plan.txt`, "utf8"));',
              '      const existingChecklist = normalizeText(fs.readFileSync(`${stateDir}/task-checklist.txt`, "utf8"));',
              '      if (!existingPlan && !existingChecklist) updatePlan(structured?.plan || summary);',
              '    } catch {',
              '      updatePlan(structured?.plan || summary);',
              '    }',
              '  }',
              '}',
              '',
              'const rl = readline.createInterface({ input: process.stdin, crlfDelay: Infinity });',
              'rl.on("line", (line) => {',
              '  const trimmed = line.trim();',
              '  if (!trimmed) return;',
              '  let event;',
              '  try {',
              '    event = JSON.parse(trimmed);',
              '  } catch {',
              '    return;',
              '  }',
              '  const eventType = typeof event?.type === "string" ? event.type : "";',
              '  const item = event?.item;',
              '  if (eventType.startsWith("item.") && item && typeof item === "object") {',
              '    handleItemEvent(eventType, item);',
              '    return;',
              '  }',
              '  const rawFallbackText = extractRawText(event);',
              '  const fallbackText = extractText(event);',
              '  if (!fallbackText) return;',
              '  const structured = parseStructuredProgress(rawFallbackText);',
              '  if (structured?.plan) updatePlan(structured.plan);',
              '  updateStatus(structured?.status || fallbackText);',
              '});',
            ].join("\n");
            const heartbeatScript = [
              'const fs = require("fs");',
              '',
              'const {',
              '  GITHUB_TOKEN,',
              '  OWNER,',
              '  REPO,',
              '  COMMENT_ID,',
              '  ACTOR,',
              '  MODE,',
              '  COMMAND_TEXT,',
              '  PROGRESS_STATE_DIR,',
              '  STARTED_AT_MS,',
              '} = process.env;',
              '',
              'function readOptional(name, fallback = "") {',
              '  try {',
              '    const value = fs.readFileSync(`${PROGRESS_STATE_DIR}/${name}`, "utf8").trim();',
              '    return value || fallback;',
              '  } catch {',
              '    return fallback;',
              '  }',
              '}',
              '',
              'async function main() {',
              '  if (!GITHUB_TOKEN || !OWNER || !REPO || !COMMENT_ID || !PROGRESS_STATE_DIR) {',
              '    return;',
              '  }',
              '  const phase = readOptional("phase.txt", "Running Codex");',
              '  const taskChecklist = readOptional("task-checklist.txt", "");',
              '  const taskPlan = readOptional("task-plan.txt", "");',
              '  const latestStatus = readOptional("latest-status.txt", "Waiting for the next Codex progress update.");',
              '  const startedAtMs = Number(STARTED_AT_MS || "0");',
              '  const elapsedMs = startedAtMs > 0 ? Math.max(0, Date.now() - startedAtMs) : 0;',
              '  const minutes = Math.floor(elapsedMs / 60000);',
              '  const seconds = Math.floor((elapsedMs % 60000) / 1000);',
              '  const marker = `<!-- codex-actor:progress mode=${MODE} status=running -->`;',
              '  const parts = [',
              '    marker,',
              '    `@${ACTOR} Codex is running.`,',
              '    "",',
              '    `Mode: \\`${MODE}\\``,',
              '    `Elapsed: ${minutes}m ${seconds}s`,',
              '    `Status: ${phase}`,',
              '    "",',
              '    "Requested command:",',
              '    "```text",',
              '    COMMAND_TEXT || "",',
              '    "```",',
              '  ];',
              '  if (taskChecklist) {',
              '    parts.push("");',
              '    parts.push("Task checklist:");',
              '    parts.push(taskChecklist);',
              '  } else if (taskPlan) {',
              '    parts.push("");',
              '    parts.push("Agent plan:");',
              '    parts.push(taskPlan);',
              '  }',
              '  if (latestStatus) {',
              '    parts.push("");',
              '    parts.push("Latest agent update:");',
              '    parts.push(latestStatus);',
              '  }',
              '',
              '  const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues/comments/${COMMENT_ID}`, {',
              '    method: "PATCH",',
              '    headers: {',
              '      "Authorization": `Bearer ${GITHUB_TOKEN}`,',
              '      "Accept": "application/vnd.github+json",',
              '      "Content-Type": "application/json",',
              '      "User-Agent": "codex-actions-workflows",',
              '    },',
              '    body: JSON.stringify({ body: parts.join("\\n") }),',
              '  });',
              '  if (!response.ok) {',
              '    const text = await response.text();',
              '    throw new Error(`Failed to update progress comment: ${response.status} ${text}`);',
              '  }',
              '}',
              '',
              'main().catch((error) => {',
              '  console.error(error?.message || String(error));',
              '  process.exitCode = 1;',
              '});',
            ].join("\n");
            fs.writeFileSync(promptPath, prompt);
            fs.writeFileSync(outputSchemaPath, JSON.stringify(outputSchema, null, 2));
            fs.mkdirSync(progressStateDir, { recursive: true });
            fs.writeFileSync(parserScriptPath, parserScript);
            fs.writeFileSync(heartbeatScriptPath, heartbeatScript);
            core.setOutput("prompt_path", promptPath);
            core.setOutput("final_message_path", finalMessagePath);
            core.setOutput("output_schema_path", outputSchemaPath);
            core.setOutput("progress_state_dir", progressStateDir);
            core.setOutput("progress_parser_script_path", parserScriptPath);
            core.setOutput("progress_heartbeat_script_path", heartbeatScriptPath);

      - name: Update progress comment for Codex execution
        uses: actions/github-script@v8
        env:
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          ACTOR: ${{ inputs.actor }}
          MODE: ${{ needs.prepare.outputs.mode }}
          COMMENT_ID: ${{ steps.create_progress_comment.outputs.comment_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const actor = process.env.ACTOR;
            const mode = process.env.MODE;
            const commentId = Number(process.env.COMMENT_ID);
            const marker = `<!-- codex-actor:progress mode=${mode} status=running -->`;
            const body = [
              marker,
              `@${actor} Codex is running.`,
              "",
              `Mode: \`${mode}\``,
              "Status: waiting for Codex's first progress update",
              "",
              "Agent plan:",
              "_Waiting for Codex to emit its first progress update._",
            ].join("\n");

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: commentId,
              body,
            });

      - name: Prepare Linux sandbox prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # The previous workaround used Codex's deprecated legacy Landlock path.
          # OpenAI's official codex-action instead prepares hosted Linux runners
          # for the modern bubblewrap sandbox by enabling user namespaces and
          # clearing Ubuntu's AppArmor gate when that knob exists.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: install_codex
        name: Install Codex CLI
        shell: bash
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          npm install -g "@openai/codex@${CODEX_VERSION}"
          codex --version

      - id: write_config
        name: Write Codex config
        shell: bash
        env:
          CODEX_API_KEY: ${{ secrets.codex_api_key }}
          CODEX_BASE_URL: ${{ steps.resolve_provider.outputs.base_url }}
          MODEL_PROVIDER: ${{ steps.resolve_provider.outputs.provider_name }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: |
          set -euo pipefail
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          echo "::add-mask::$CODEX_API_KEY"
          {
            printf 'model_provider = "%s"\n' "$MODEL_PROVIDER"
            printf 'model = "%s"\n' "$MODEL"
            printf 'model_reasoning_effort = "%s"\n' "$EFFORT"
            printf 'sandbox_mode = "workspace-write"\n\n'
            printf '[features]\n'
            printf 'multi_agent = false\n'
            printf 'guardian_approval = false\n'
            printf 'remote_connections = false\n'
            printf 'apps = false\n'
            printf 'apps_mcp_gateway = false\n\n'
            printf '[model_providers.%s]\n' "$MODEL_PROVIDER"
            printf 'name = "OpenAI"\n'
            printf 'base_url = "%s"\n' "$CODEX_BASE_URL"
            printf 'wire_api = "responses"\n'
            printf 'requires_openai_auth = false\n'
            printf 'experimental_bearer_token = "%s"\n' "$CODEX_API_KEY"
          } > "$CODEX_HOME/config.toml"
          {
            echo "codex_home=$CODEX_HOME"
            echo "config_path=$CODEX_HOME/config.toml"
          } >> "$GITHUB_OUTPUT"

      - name: Register repo-local ignores for runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          exclude_file=".git/info/exclude"
          touch "$exclude_file"
          # Keep workflow-local junk out of git status/add without mutating the
          # repository's tracked .gitignore policy.
          for pattern in ".codex" ".codex/" "__pycache__/" "*.py[cod]"; do
            if ! grep -qxF "$pattern" "$exclude_file"; then
              printf '%s\n' "$pattern" >> "$exclude_file"
            fi
          done

      - id: run_codex
        name: Run Codex
        continue-on-error: true
        shell: bash
        env:
          CODEX_HOME: ${{ steps.write_config.outputs.codex_home }}
          MODEL: ${{ inputs.model }}
          PROMPT_PATH: ${{ steps.prompt.outputs.prompt_path }}
          FINAL_MESSAGE_PATH: ${{ steps.prompt.outputs.final_message_path }}
          OUTPUT_SCHEMA_PATH: ${{ steps.prompt.outputs.output_schema_path }}
          PROGRESS_STATE_DIR: ${{ steps.prompt.outputs.progress_state_dir }}
          PROGRESS_PARSER_SCRIPT_PATH: ${{ steps.prompt.outputs.progress_parser_script_path }}
          PROGRESS_HEARTBEAT_SCRIPT_PATH: ${{ steps.prompt.outputs.progress_heartbeat_script_path }}
          COMMENT_ID: ${{ steps.create_progress_comment.outputs.comment_id }}
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          ACTOR: ${{ inputs.actor }}
          MODE: ${{ needs.prepare.outputs.mode }}
          COMMAND_TEXT: ${{ needs.prepare.outputs.command_text }}
          STARTED_AT_MS: ${{ steps.create_progress_comment.outputs.started_at_ms }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$PROGRESS_STATE_DIR"
          printf '%s\n' 'Running Codex' > "$PROGRESS_STATE_DIR/phase.txt"
          printf '%s\n' 'Waiting for the first Codex progress update.' > "$PROGRESS_STATE_DIR/latest-status.txt"
          : > "$PROGRESS_STATE_DIR/task-plan.txt"
          : > "$PROGRESS_STATE_DIR/task-checklist.txt"
          heartbeat_stop="$PROGRESS_STATE_DIR/heartbeat-stop"
          rm -f "$heartbeat_stop"
          (
            while [[ ! -f "$heartbeat_stop" ]]; do
              node "$PROGRESS_HEARTBEAT_SCRIPT_PATH" || true
              sleep 5
            done
          ) &
          heartbeat_pid=$!
          stderr_log="$PROGRESS_STATE_DIR/codex-stderr.log"
          set +e
          codex exec \
            --json \
            --skip-git-repo-check \
            --sandbox workspace-write \
            --model "$MODEL" \
            --output-schema "$OUTPUT_SCHEMA_PATH" \
            --output-last-message "$FINAL_MESSAGE_PATH" \
            - < "$PROMPT_PATH" 2> >(tee "$stderr_log" >&2) | node "$PROGRESS_PARSER_SCRIPT_PATH"
          codex_status=${PIPESTATUS[0]}
          set -e
          touch "$heartbeat_stop"
          wait "$heartbeat_pid" || true
          exit "$codex_status"

      - id: capture_codex
        name: Capture Codex output
        if: always()
        uses: actions/github-script@v8
        env:
          FINAL_MESSAGE_PATH: ${{ steps.prompt.outputs.final_message_path }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const finalMessagePath = process.env.FINAL_MESSAGE_PATH;
            let finalMessage = "";
            let commitMessage = "";
            let taskPlan = "";
            if (finalMessagePath && fs.existsSync(finalMessagePath)) {
              const raw = fs.readFileSync(finalMessagePath, "utf8");
              try {
                const parsed = JSON.parse(raw);
                const rawTaskPlan = Array.isArray(parsed.task_plan) ? parsed.task_plan : [];
                const replyMarkdown = typeof parsed.reply_markdown === "string" ? parsed.reply_markdown.trim() : "";
                const changeSummary = typeof parsed.change_summary === "string" ? parsed.change_summary.trim() : "";
                const testsRun = typeof parsed.tests_run === "string" ? parsed.tests_run.trim() : "";
                const rawCommitMessage = typeof parsed.commit_message === "string" ? parsed.commit_message : "";
                commitMessage = rawCommitMessage.replace(/\r\n/g, "\n").split("\n")[0].trim();
                taskPlan = rawTaskPlan
                  .map((item) => typeof item === "string" ? item.trim() : "")
                  .filter(Boolean)
                  .slice(0, 4)
                  .map((item, index) => `${index + 1}. ${item}`)
                  .join("\n");

                finalMessage = [
                  replyMarkdown || changeSummary || "No summary returned.",
                  "",
                  `Tests/checks: ${testsRun || "Not run."}`,
                ].join("\n");
              } catch {
                finalMessage = raw;
              }
            }
            core.setOutput("final_message", finalMessage);
            core.setOutput("commit_message", commitMessage);
            core.setOutput("task_plan", taskPlan);

      - id: scan_changes
        name: Scan working tree changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          delimiter="CODEX_FILES_$(date +%s%N)"
          tracked_changes="$(git status --short)"
          if [[ -n "$tracked_changes" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<$delimiter"
              printf '%s\n' "$tracked_changes"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<$delimiter"
              echo "No tracked changes."
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Update progress comment for persistence
        if: always()
        uses: actions/github-script@v8
        env:
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          ACTOR: ${{ inputs.actor }}
          MODE: ${{ needs.prepare.outputs.mode }}
          COMMENT_ID: ${{ steps.create_progress_comment.outputs.comment_id }}
          CODEX_OUTCOME: ${{ steps.run_codex.outcome }}
          CHANGED: ${{ steps.scan_changes.outputs.changed }}
          DRY_RUN: ${{ inputs.dry_run }}
          STATE_DIR: ${{ steps.prompt.outputs.progress_state_dir }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const actor = process.env.ACTOR;
            const mode = process.env.MODE;
            const commentId = Number(process.env.COMMENT_ID);
            const codexOutcome = process.env.CODEX_OUTCOME;
            const changed = process.env.CHANGED === "true";
            const dryRun = process.env.DRY_RUN === "true";
            const stateDir = process.env.STATE_DIR || "";
            let status = "finalizing";
            let statusText = "assembling the final response";
            const readStateFile = (name, fallback = "") => {
              if (!stateDir) return fallback;
              try {
                const value = fs.readFileSync(`${stateDir}/${name}`, "utf8").trim();
                return value || fallback;
              } catch {
                return fallback;
              }
            };
            const taskChecklist = readStateFile("task-checklist.txt", "");
            const taskPlan = readStateFile("task-plan.txt", "");
            const latestStatus = readStateFile("latest-status.txt", "");

            if (changed && !dryRun) {
              status = "persisting";
              statusText = codexOutcome === "success"
                ? (mode === "issue"
                    ? "committing changes and syncing branch or PR state"
                    : "committing and pushing repository changes")
                : (mode === "issue"
                    ? "Codex was interrupted; preserving tracked changes and syncing branch or PR state"
                    : "Codex was interrupted; preserving tracked changes");
            } else if (codexOutcome !== "success") {
              status = "failed";
              statusText = "Codex did not complete successfully";
            }

            const marker = `<!-- codex-actor:progress mode=${mode} status=${status} -->`;
            const parts = [
              marker,
              `@${actor} Codex run in progress.`,
              "",
              `Mode: \`${mode}\``,
              `Status: ${statusText}`,
            ];
            if (taskChecklist) {
              parts.push("");
              parts.push("Task checklist:");
              parts.push(taskChecklist);
            } else if (taskPlan) {
              parts.push("");
              parts.push("Agent plan:");
              parts.push(taskPlan);
            }
            if (latestStatus) {
              parts.push("");
              parts.push("Latest agent update:");
              parts.push(latestStatus);
            }

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: commentId,
              body: parts.join("\n"),
            });

      - id: commit_push
        name: Commit and push changes
        if: always() && steps.scan_changes.outputs.changed == 'true' && inputs.dry_run == false
        shell: bash
        env:
          PUSH_REF: ${{ needs.prepare.outputs.push_ref }}
          MODE: ${{ needs.prepare.outputs.mode }}
          TARGET_NUMBER: ${{ needs.prepare.outputs.target_number }}
          COMMIT_MESSAGE: ${{ steps.capture_codex.outputs.commit_message }}
        run: |
          set -euo pipefail
          commit_message="${COMMIT_MESSAGE//$'\r'/}"
          if [[ -z "$commit_message" ]]; then
            commit_message="codex: apply request from ${MODE} #${TARGET_NUMBER}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$commit_message"
          git push origin "HEAD:${PUSH_REF}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: ensure_issue_pr
        name: Create or update issue PR
        if: always() && needs.prepare.outputs.mode == 'issue' && steps.scan_changes.outputs.changed == 'true' && inputs.dry_run == false && steps.commit_push.outcome == 'success'
        uses: actions/github-script@v8
        env:
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          DEFAULT_BRANCH: ${{ needs.prepare.outputs.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH_NAME: ${{ needs.prepare.outputs.bot_branch }}
          ISSUE_TITLE: ${{ needs.prepare.outputs.issue_title }}
          BRANCH_EXISTS: ${{ steps.issue_branch.outputs.branch_exists }}
          COMMIT_PUSH_OUTCOME: ${{ steps.commit_push.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branchName = process.env.BRANCH_NAME;
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const issueTitle = process.env.ISSUE_TITLE || `Issue ${issueNumber}`;
            const branchExists = (process.env.BRANCH_EXISTS || "false") === "true";
            const commitPushed = process.env.COMMIT_PUSH_OUTCOME === "success";

            core.setOutput("pr_url", "");
            core.setOutput("pr_number", "");
            core.setOutput("pr_error", "");

            if (!branchExists && !commitPushed) {
              return;
            }

            try {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${branchName}`,
                base: defaultBranch,
                per_page: 1,
              });

              if (pulls.length > 0) {
                core.setOutput("pr_url", pulls[0].html_url);
                core.setOutput("pr_number", String(pulls[0].number));
                return;
              }

              const { data: pull } = await github.rest.pulls.create({
                owner,
                repo,
                title: `Codex: ${issueTitle}`.slice(0, 240),
                head: branchName,
                base: defaultBranch,
                body: `Automated Codex changes for #${issueNumber}.\n\nRefs #${issueNumber}.`,
              });

              core.setOutput("pr_url", pull.html_url);
              core.setOutput("pr_number", String(pull.number));
            } catch (error) {
              const message = error && error.message ? error.message : String(error);
              core.warning(message);
              core.setOutput("pr_error", message);
            }

      - id: status
        name: Compute actor status
        if: always()
        shell: bash
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          CODEX_OUTCOME: ${{ steps.run_codex.outcome }}
          CHANGED: ${{ steps.scan_changes.outputs.changed }}
          COMMIT_OUTCOME: ${{ steps.commit_push.outcome }}
          PR_ERROR: ${{ steps.ensure_issue_pr.outputs.pr_error }}
        run: |
          set -euo pipefail
          status="success"

          if [[ "$COMMIT_OUTCOME" == "failure" || "$COMMIT_OUTCOME" == "cancelled" ]]; then
            status="push_failed"
          elif [[ "$MODE" == "issue" && "$CHANGED" == "true" && -n "$PR_ERROR" ]]; then
            status="pr_failed"
          elif [[ "$CODEX_OUTCOME" != "success" && "$CHANGED" == "true" && "$DRY_RUN" != "true" && "$COMMIT_OUTCOME" == "success" ]]; then
            status="partial_persisted"
          elif [[ "$CODEX_OUTCOME" != "success" ]]; then
            status="codex_failed"
          elif [[ "$CHANGED" != "true" ]]; then
            status="no_changes"
          elif [[ "$DRY_RUN" == "true" ]]; then
            status="dry_run"
          fi

          echo "run_status=$status" >> "$GITHUB_OUTPUT"

      - name: Fail workflow on actor error
        if: always() && contains('codex_failed,push_failed', steps.status.outputs.run_status)
        shell: bash
        run: |
          echo "Actor run ended with status: ${{ steps.status.outputs.run_status }}"
          exit 1

  reply:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - act
    if: always() && needs.prepare.outputs.should_reply == 'true'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post result comment
        uses: actions/github-script@v8
        env:
          OWNER: ${{ inputs.repository_owner }}
          REPO: ${{ inputs.repository_name }}
          ACTOR: ${{ inputs.actor }}
          MODE: ${{ needs.prepare.outputs.mode }}
          REPLY_NUMBER: ${{ needs.prepare.outputs.reply_number }}
          SKIP_REASON: ${{ needs.prepare.outputs.skip_reason }}
          COMMAND_TEXT: ${{ needs.prepare.outputs.command_text }}
          RUN_STATUS: ${{ needs.act.outputs.run_status }}
          FINAL_MESSAGE: ${{ needs.act.outputs.final_message }}
          CHANGED: ${{ needs.act.outputs.changed }}
          CHANGED_FILES: ${{ needs.act.outputs.changed_files }}
          COMMIT_SHA: ${{ needs.act.outputs.commit_sha }}
          PR_URL: ${{ needs.act.outputs.pr_url }}
          PR_NUMBER: ${{ needs.act.outputs.pr_number }}
          PR_ERROR: ${{ needs.act.outputs.pr_error }}
          TASK_PLAN: ${{ needs.act.outputs.task_plan }}
          TRACKING_COMMENT_ID: ${{ needs.act.outputs.tracking_comment_id }}
          STARTED_AT_MS: ${{ needs.act.outputs.started_at_ms }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = process.env.OWNER;
            const repo = process.env.REPO;
            const actor = process.env.ACTOR;
            const replyNumber = Number(process.env.REPLY_NUMBER);
            const mode = process.env.MODE;
            const skipReason = process.env.SKIP_REASON;
            const commandText = process.env.COMMAND_TEXT || "";
            const runStatus = process.env.RUN_STATUS || "";
            const finalMessage = process.env.FINAL_MESSAGE || "";
            const changed = process.env.CHANGED === "true";
            const changedFiles = process.env.CHANGED_FILES || "No tracked changes.";
            const commitSha = process.env.COMMIT_SHA || "";
            const prUrl = process.env.PR_URL || "";
            const prNumber = process.env.PR_NUMBER || "";
            const prError = process.env.PR_ERROR || "";
            const taskPlan = process.env.TASK_PLAN || "";
            const trackingCommentId = Number(process.env.TRACKING_COMMENT_ID || "0");
            const startedAtMs = Number(process.env.STARTED_AT_MS || "0");
            const serverUrl = process.env.SERVER_URL || "https://github.com";
            const repository = process.env.REPOSITORY || `${owner}/${repo}`;
            const runId = process.env.RUN_ID || "";
            const runAttempt = process.env.RUN_ATTEMPT || "";
            const dryRun = process.env.DRY_RUN === "true";
            const marker = `<!-- codex-actor:reply mode=${mode} status=${runStatus || "unknown"} -->`;
            const runUrl = runId ? `${serverUrl}/${repository}/actions/runs/${runId}` : "";
            const commitUrl = commitSha ? `${serverUrl}/${repository}/commit/${commitSha}` : "";
            const durationMs = startedAtMs > 0 ? Math.max(0, Date.now() - startedAtMs) : 0;
            const durationMinutes = Math.floor(durationMs / 60000);
            const durationSeconds = Math.floor((durationMs % 60000) / 1000);
            const durationText = startedAtMs > 0 ? `${durationMinutes}m ${durationSeconds}s` : "";

            let body = "";

            if (skipReason === "untrusted") {
              body = `${marker}\n@${actor} this workflow only accepts \`@codex\` or \`/codex\` commands from trusted collaborators.`;
            } else if (skipReason === "empty_command") {
              body = `${marker}\n@${actor} include an instruction after \`@codex\` or \`/codex\` so I know what to do.`;
            } else if (skipReason === "fork_pr_unsupported") {
              body = `${marker}\n@${actor} this PR comes from a fork, so v1 will not try to push to the contributor branch from this workflow.`;
            } else {
              const statusLine = {
                success: "Completed the requested run.",
                no_changes: "Ran successfully and did not need to change tracked files.",
                dry_run: "Dry run complete. Changes were produced but not committed.",
                partial_persisted: "Codex was interrupted, but tracked changes were preserved and pushed.",
                codex_failed: "Codex did not complete successfully.",
                push_failed: "Codex finished, but committing or pushing changes failed.",
                pr_failed: "Codex finished and changes were pushed, but PR creation or lookup failed.",
              }[runStatus || "success"] || "Run finished.";

              const parts = [
                `@${actor} ${statusLine}`,
                "",
                `Mode: \`${mode}\``,
                `Changed files: ${changed ? "yes" : "no"}`,
                `Dry run: ${dryRun ? "yes" : "no"}`,
              ];

              if (durationText) {
                parts.push(`Duration: ${durationText}`);
              }
              if (runUrl) {
                const runLabel = runAttempt ? `workflow run #${runAttempt}` : "workflow run";
                parts.push(`Run: [${runLabel}](${runUrl})`);
              }
              if (commitSha) {
                const shortSha = commitSha.slice(0, 12);
                parts.push(`Commit: [\`${shortSha}\`](${commitUrl || "#"})`);
              }
              if (prUrl) {
                parts.push(`PR: [#${prNumber}](${prUrl})`);
              } else if (prError) {
                parts.push(`PR creation: ${prError}`);
              }

              if (taskPlan) {
                parts.push("");
                parts.push("Task plan:");
                parts.push(taskPlan);
              }

              parts.push("");
              parts.push("Requested command:");
              parts.push("```text");
              parts.push(commandText);
              parts.push("```");
              parts.push("");
              parts.push("Codex summary:");
              parts.push(finalMessage || "_No final message returned._");
              parts.push("");
              parts.push("Tracked changes detected before persistence:");
              parts.push("```text");
              parts.push(changedFiles);
              parts.push("```");

              body = `${marker}\n${parts.join("\n")}`;
            }

            if (trackingCommentId > 0) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: trackingCommentId,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: replyNumber,
                body,
              });
            }
